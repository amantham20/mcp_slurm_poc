# slurm.conf
ClusterName=slurm-cluster
ControlMachine=slurmctld
ControlAddr=slurmctld

SlurmUser=slurm
SlurmdUser=root
SlurmctldPort=6817
SlurmdPort=6818
AuthType=auth/munge
StateSaveLocation=/var/spool/slurm
SlurmdSpoolDir=/var/spool/slurm
SwitchType=switch/none
MpiDefault=none
SlurmctldPidFile=/var/run/slurm/slurmctld.pid
SlurmdPidFile=/var/run/slurm/slurmd.pid
ProctrackType=proctrack/cgroup
ReturnToService=2
MaxJobCount=10000

# Logging
SlurmctldDebug=3
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdDebug=3
SlurmdLogFile=/var/log/slurm/slurmd.log

# Accounting
JobCompType=jobcomp/mysql
JobCompHost=mysql
JobCompUser=slurm
JobCompPass=password
JobCompDB=slurm_acct_db

AccountingStorageType=accounting_storage/mysql
AccountingStorageHost=mysql
AccountingStorageUser=slurm
AccountingStoragePass=password
AccountingStorageDB=slurm_acct_db

# Node definitions
NodeName=node[1-3] CPUs=2 RealMemory=2000 Sockets=1 CoresPerSocket=2 ThreadsPerCore=1 State=UNKNOWN

# Partition definition
PartitionName=debug Nodes=node[1-3] Default=YES MaxTime=INFINITE State=UP