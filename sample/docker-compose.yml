services:
  mysql:
    image: mysql:5.7
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: slurm_acct_db
      MYSQL_USER: slurm
      MYSQL_PASSWORD: password

  slurmdbd:
    image: giovtorres/slurm-docker-cluster:latest
    hostname: slurmdbd
    depends_on: [mysql]
    volumes:
      - slurm_config:/etc/slurm
      - slurm_logs:/var/log/slurm
      - slurm_state:/var/spool/slurm
    command: ["/usr/sbin/slurmdbd","-D"]

  slurmctld:
    image: giovtorres/slurm-docker-cluster:latest
    hostname: slurmctld
    depends_on: [slurmdbd]
    volumes:
      - slurm_config:/etc/slurm
      - slurm_logs:/var/log/slurm
      - slurm_state:/var/spool/slurm
    ports: ["6817:6817"]
    command: ["/usr/sbin/slurmctld","-D"]

  c1:
    image: giovtorres/slurm-docker-cluster:latest
    hostname: c1
    depends_on: [slurmctld]
    privileged: true
    volumes:
      - slurm_config:/etc/slurm
      - slurm_logs:/var/log/slurm
      - slurm_state:/var/spool/slurm
    command: ["/usr/sbin/slurmd","-D"]

  c2:
    image: giovtorres/slurm-docker-cluster:latest
    hostname: c2
    depends_on: [slurmctld]
    privileged: true
    volumes:
      - slurm_config:/etc/slurm
      - slurm_logs:/var/log/slurm
      - slurm_state:/var/spool/slurm
    command: ["/usr/sbin/slurmd","-D"]

volumes:
  slurm_config:
  slurm_logs:
  slurm_state:
